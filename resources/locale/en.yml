fof-oauth:
  admin:
    # This is used by extensions which extend fof/oauth to add additional providers
    configure_button_label: Configure with FoF OAuth
    settings_accessibility_label: "{name} settings"

    permissions:
      moderate_user_providers: Moderate user's linked accounts

    settings:
      advanced:
        heading: Advanced
        log-oauth-errors-label: Log OAuth errors
        log-oauth-errors-help: If enabled, OAuth errors will be logged to the Flarum log. This may help with debugging OAuth issues, but may also contain sensitive information.
      only_icons_label: Only show the Log In Button icons (alternative layout)
      update_email_from_provider_label: Update email address from provider
      update_email_from_provider_help: If enabled, logging in with an OAuth provider whose verified email differs from the user's forum email sends a confirmation link to the new address, and a notice to the current one. The email changes once the link is followed. Providers that cannot confirm the address is verified, including third-party providers that have not been updated to support it, will not change the email address.
      oauth_only_label: Only allow logging in and signing up with OAuth providers
      oauth_only_help: >
        If enabled, members can no longer log in, sign up or reset their password with a password; they use the enabled providers instead.
        Administrators keep password login, through the "Administrator login" link in the log in modal.
        Existing members without a linked provider are linked on their first provider login if the provider confirms the same email address; anyone else will need an administrator's help.
        Has no effect while no provider is enabled. Keep "Allow sign up" enabled in Permissions, otherwise new members can't sign up with a provider either.
      disable_avatars_label: Disable avatars from provider
      disable_avatars_help: >
        If enabled, the user's avatar will not be updated to match the provider's avatar on signup.
        Note that this only affects future signups, and will not change the avatar of existing users.
      providers:
        callback_url_text: If necessary, set the callback URL to {url}.
        group_label: Assign Group
        group_help: Select a group to automatically assign to users who register using this provider.
        no_group_label: No group assignment

        discord:
          description: Create an app at {link}. Add the redirect URL in the OAuth2 tab.

          client_id_label: => fof-oauth.ref.settings.client_id
          client_secret_label: => fof-oauth.ref.settings.client_secret

        facebook:
          description: Create an app at {link}.

          app_id_label: => fof-oauth.ref.settings.app_id
          app_secret_label: => fof-oauth.ref.settings.app_secret

        github:
          description: Create an OAuth app at {link}.

          client_id_label: => fof-oauth.ref.settings.client_id
          client_secret_label: => fof-oauth.ref.settings.client_secret

        gitlab:
          description: Create an application at {link}. Give the application the <code>read_user</code> scope.

          client_id_label: => fof-oauth.ref.settings.app_id
          client_secret_label: => fof-oauth.ref.settings.app_secret
          domain_label: GitLab Domain

        google:
          description: Create an application at {link}.

          client_id_label: => fof-oauth.ref.settings.client_id
          client_secret_label: => fof-oauth.ref.settings.client_secret
          hosted_domain_label: Hosted Domain (G suite/Google Apps for Business, optional)

        linkedin:
          description: Create an application at {link}.

          client_id_label: => fof-oauth.ref.settings.client_id
          client_secret_label: => fof-oauth.ref.settings.client_secret

  forum:
    log_in:
      unverified_email_in_use: "{provider} hasn't confirmed this email address, so we can't use it to sign you in. If you already have an account, log in below, then link {provider} from your account settings."
      unverified_email_in_use_oauth_only: "{provider} hasn't confirmed this email address, so we can't use it to sign you in. Confirm the address with {provider} and try again, or ask an administrator for help."
      admin_log_in_link: Administrator login
      with_button: Log In with {provider}

      # Modify these if your provider requires specific wording.
      # You may use {provider} in the translation.
      with_discord_button: '=> fof-oauth.forum.log_in.with_button'
      with_facebook_button: '=> fof-oauth.forum.log_in.with_button'
      with_github_button: '=> fof-oauth.forum.log_in.with_button'
      with_gitlab_button: '=> fof-oauth.forum.log_in.with_button'
      with_google_button: '=> fof-oauth.forum.log_in.with_button'
      with_linkedin_button: '=> fof-oauth.forum.log_in.with_button'

    user:
      settings:
        linked-account:
          label: Linked accounts
          last-used-label: Last used
          link-created-label: Link created
          identification-label: "{provider} ID"
          orphaned-account: You have signed in through this provider previously, but this forum has disabled sign-in with this method since.
          help: These linked accounts allow you to sign into the forum using other providers.
          identifier-label: "{provider} ID"
          unlink-confirm: Are you sure you want to remove the link with {provider}? You will no longer be able to sign in to this forum unless you re-authenticate in the future.
    # Modify these if you need to change how the provider name
    # appears in the log in button.
    providers:
      discord: '=> fof-oauth.lib.providers.discord'
      facebook: '=> fof-oauth.lib.providers.facebook'
      github: '=> fof-oauth.lib.providers.github'
      gitlab: '=> fof-oauth.lib.providers.gitlab'
      google: '=> fof-oauth.lib.providers.google'
      linkedin: '=> fof-oauth.lib.providers.linkedin'

    account_linked:
      title: Account linked
      body: "Your {forum} account <strong>{username}</strong> is now linked with {provider}. You can sign in using either your forum password or {provider} going forward."
      dismiss_button: Got it

    signup:
      username_help: Please choose a username to be known by here

    unlink: Remove link

    error:
      bad_verification_code: Invalid or expired verification token. Please try again.
      invalid_state: Invalid state. Please try again.
      already_linked: This account is already linked to another user.

  email:
    provider_email_change_notice:
      subject: "Email Address Change Requested"
      # The greeting is added by the email layout.
      body: |
        After you signed in to {forum} with {provider}, a change of your account's email address to {new_email} was requested. The change takes effect once the new address is confirmed.

        If this wasn't you, your {provider} account may be compromised. Secure it, and contact the {forum} administrators.

  lib:
    providers:
      discord: Discord
      facebook: Facebook
      github: GitHub
      gitlab: GitLab
      google: Google
      linkedin: LinkedIn

    gambits:
      sso:
        key: sso
        hint: a login provider

  ref:
    settings:
      app_id: App ID
      app_secret: App Secret

      client_id: Client ID
      client_secret: Client Secret

